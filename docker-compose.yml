services:
  evently.database:
    image: postgres:18
    container_name: LlmVoucherGateway.Database
    environment:
      - POSTGRES_DB=llm_voucher_gateway
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql
    ports:
      - 5432:5432

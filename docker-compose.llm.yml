# Requires host to have NVIDIA GPU and NVIDIA Container Toolkit installed:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/index.htm

# See Makefile for example curl requests to hit the LLM and Gateway API.

# Adjustments may be needed for different hardware.
# You will need to configure this to use the right model and GPU memory, not use
# WSL, etc.
services:
  llm-server:
    image: vllm/vllm-openai:v0.29.0
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      # WSL2 kernel supports pinned memory (needed for vLLM's UVA buffers)
      # but vLLM keeps it opt-in on WSL2 by default; enable it explicitly.
      # It's set to use 85% of available VRAM.
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
    command: >
      --model Qwen/Qwen2.5-0.5B-Instruct
      --gpu-memory-utilization 0.85
      --enable-force-include-usage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  huggingface-cache:

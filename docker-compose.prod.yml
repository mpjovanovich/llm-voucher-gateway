# The production stack on the GPU server. See planning/vps-deployment.md.
#
#   make deploy
#
# Requires the NVIDIA Container Toolkit, a Caddyfile beside this file, and a
# .env (copy .env.example).The host data directory must be writable by the
# gateway's UID 1654: chown 1654 /srv/llm-gateway/data
#
# Caddy is the only public entry point. The gateway is published on host loopback
# for admin use over SSH. vLLM has no published port and no --api-key.

name: llm-voucher-gateway-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Long syntax, so a missing Caddyfile fails the start instead of being
      # created as an empty directory.
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      # Certificates. Losing this re-requests them on every rebuild, which runs
      # into Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
      - web

  gateway:
    build:
      context: .
      dockerfile: src/LlmVoucherGateway.Api/Dockerfile
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # The directory, not the database file: WAL mode keeps -wal and -shm beside it.
      - ${GATEWAY_DATA_DIR:-/srv/llm-gateway/data}:/data
    environment:
      # Forwarded headers make the client address in the request and issuance
      # logs the real caller instead of Caddy's address on this network.
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Inference__BaseUrl=http://llm-server:8000
      - Admin__Keys__0=${ADMIN_KEY:?set ADMIN_KEY in .env}
      - Database__Path=/data/vouchers.db
    depends_on:
      - llm-server

  web:
    build:
      context: src/LlmVoucherGateway.Web
    restart: unless-stopped
    logging: *logging
    environment:
      - GATEWAY_BASE_URL=http://gateway:8080/v1
    depends_on:
      - gateway

  llm-server:
    image: vllm/vllm-openai:v0.29.0
    restart: unless-stopped
    logging: *logging
    ipc: host
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      - VLLM_WSL2_ENABLE_PIN_MEMORY=${VLLM_WSL2_ENABLE_PIN_MEMORY:-0}
    command: >
      --model ${VLLM_MODEL:?set VLLM_MODEL in .env - copy .env.example}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:?set VLLM_GPU_MEMORY_UTILIZATION in .env - copy .env.example}
      --enable-force-include-usage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  caddy-data:
  caddy-config:
  huggingface-cache:
